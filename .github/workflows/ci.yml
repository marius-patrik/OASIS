name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust contracts and universal runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile and test independent runtime and storage codecs
        run: cargo test --workspace --lib --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  database:
    name: PostgreSQL migrations and integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis_ci
          POSTGRES_DB: oasis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis -d oasis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: oasis
      PGPASSWORD: oasis_ci
      PGDATABASE: oasis
    steps:
      - uses: actions/checkout@v4
      - name: Apply universal migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f migrations/0001_core.sql
          psql -v ON_ERROR_STOP=1 -f migrations/0002_indexes.sql
          psql -v ON_ERROR_STOP=1 -f migrations/0003_transfers.sql
          psql -v ON_ERROR_STOP=1 -f migrations/0004_world_travel.sql
          psql -v ON_ERROR_STOP=1 -f migrations/0005_native_checkpoints.sql
      - name: Verify relational persistence and constraints
        run: psql -v ON_ERROR_STOP=1 -f tests/schema_smoke.sql
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare independent PostgreSQL runtime test fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/store_fixture.sql
      - name: Run Rust-to-PostgreSQL real travel and recovery tests
        env:
          DATABASE_URL: "host=localhost port=5432 user=oasis password=oasis_ci dbname=oasis"
        run: cargo test -p oasis-store --test postgres --locked -- --test-threads=1
      - name: Recover committed native state in a new universe runtime
        env:
          DATABASE_URL: "host=localhost port=5432 user=oasis password=oasis_ci dbname=oasis"
        run: cargo test -p oasis-service --test postgres --locked -- --test-threads=1

  boundaries:
    name: Specification and adapter independence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify universal implementation boundaries
        run: python3 tests/verify_structure.py
